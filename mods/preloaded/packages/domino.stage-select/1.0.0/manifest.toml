# Stage Select for No One Can Stop Mr. Domino (SLUS-00804).
#
# The stage counter at 0x800B2D98 is NOT initialised from a constant. It is
# unpacked from the memory-card save block, after a checksum check:
#
#   0x80030D4C ..            checksum loop over 0x800BCC0 .. +0x1FFC
#   0x80030D94  bne   $v0, $a0, 0x80030eb0   ; mismatch -> no-save path
#   0x80030DA0  addiu $a3, $a3, 0x3748       ; save block copied to 0x800B3748
#   0x80030DA8 ..            memcpy loop
#   0x80030DE4  lui   $v1, 0x800b
#   0x80030DE8  lbu   $v1, 0x3748($v1)       ; stage byte from the save  <-- patched
#   0x80030E40  sh    $v1, 0x2d98($at)       ; -> the stage counter
#
# $v1 is not touched between that load and that store, so replacing the load
# with a constant sets the stage regardless of what the save holds.
#
# An earlier attempt patched 0x800130FC (the "first stage = 1" branch of the
# stage-ADVANCE routine). That branch only runs when the counter is already
# zero, which never happens once a save exists, so it had no effect even though
# the patch was verifiably live in RAM.
#
# The option is a choice rather than a bounded integer because each value needs
# a different opcode, not a different immediate inside one instruction:
# replace_from can only substitute a field within the guarded bytes.
#
# Known limit: this patches the checksum-OK path. With no valid save the game
# branches to 0x80030EB0 instead and this patch is bypassed.

format_version = 1
id = "domino.stage-select"
version = "1.0.0"
name = "Stage Select"
author = "DominoRecomp"
description = "Start on any stage by overriding the stage byte unpacked from the save."
license = "MIT"
resolver = "declarative"

[[target]]
game_id = "SLUS-00804"

[[feature]]
id = "stage-select"
name = "Stage Select"
description = "Force the starting stage, ignoring the stage recorded in your save."
group = "Quality of Life"
default_enabled = false

[[option]]
feature = "stage-select"
id = "stage"
label = "Starting stage"
description = "Stage numbers follow the game's own order. 1 is stock behaviour."
group = "Quality of Life"
type = "choice"
default = "1"

[[option.choice]]
feature = "stage-select"
value = "1"
label = "Stage 1"

[[option.choice]]
feature = "stage-select"
value = "2"
label = "Stage 2"

[[option.choice]]
feature = "stage-select"
value = "3"
label = "Stage 3"

[[option.choice]]
feature = "stage-select"
value = "4"
label = "Stage 4"

[[option.choice]]
feature = "stage-select"
value = "5"
label = "Stage 5"

[[option.choice]]
feature = "stage-select"
value = "6"
label = "Stage 6"

[[patch]]
feature = "stage-select"
target = "main_exe"
address = 0x80030DE8
expected = "48 37 63 90"
replace = "02 00 03 24"
when = { stage = "2" }

[[patch]]
feature = "stage-select"
target = "main_exe"
address = 0x80030DE8
expected = "48 37 63 90"
replace = "03 00 03 24"
when = { stage = "3" }

[[patch]]
feature = "stage-select"
target = "main_exe"
address = 0x80030DE8
expected = "48 37 63 90"
replace = "04 00 03 24"
when = { stage = "4" }

[[patch]]
feature = "stage-select"
target = "main_exe"
address = 0x80030DE8
expected = "48 37 63 90"
replace = "05 00 03 24"
when = { stage = "5" }

[[patch]]
feature = "stage-select"
target = "main_exe"
address = 0x80030DE8
expected = "48 37 63 90"
replace = "06 00 03 24"
when = { stage = "6" }
